{% extends "base.html" %}
{% block title %}Brand{% endblock %}
{% block content %}
<a href="{{ url_for('admin.dashboard') }}" class="text-sm text-blue-600">&larr; Dashboard</a>
<div class="flex justify-between items-center mt-2 mb-6">
  <h1 class="text-2xl font-bold">Brand</h1>
  <a href="{{ url_for('admin.brand_create') }}" class="bg-blue-600 text-white px-4 py-2 rounded">+ Tambah</a>
</div>

<table class="w-full bg-white rounded shadow text-sm">
  <thead class="bg-gray-100 text-left">
    <tr>
      <th class="p-3">Nama</th>
      <th class="p-3">Slug</th>
      <th class="p-3">Produk</th>
      <th class="p-3 text-right">Aksi</th>
    </tr>
  </thead>
  <tbody>
  {% for b in brands %}
    <tr class="border-t">
      <td class="p-3">{{ b.name }}</td>
      <td class="p-3 text-gray-500">{{ b.slug }}</td>
      <td class="p-3">{{ b.products | length }}</td>
      <td class="p-3 text-right whitespace-nowrap">
        <a href="{{ url_for('admin.brand_edit', id=b.id) }}" class="text-blue-600 mr-3">Edit</a>
        <form method="post" action="{{ url_for('admin.brand_delete', id=b.id) }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="text-red-600">Hapus</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="p-6 text-center text-gray-500">Belum ada brand.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

<a href="{{ url_for('shop.detail', slug=p.slug) }}" class="group flex flex-col border border-transparent hover:border-black">
  <div class="aspect-square bg-neutral-100 flex items-center justify-center text-neutral-400 text-sm">
    Belum ada gambar
  </div>
  <div class="p-2 flex flex-col gap-0.5">
    <p class="font-bold">{{ p.harga | rupiah }}</p>
    <h3 class="group-hover:underline">{{ p.nama }}</h3>
    <p class="text-sm text-neutral-500">{{ p.category.nama }}</p>
    {% if p.stock == 0 %}
      <p class="text-sm text-red-700">Stok habis</p>
    {% endif %}
  </div>
</a>

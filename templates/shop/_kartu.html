<a href="{{ url_for('shop.detail', slug=p.slug) }}" class="bg-white rounded shadow p-4 flex flex-col hover:shadow-md">
  <div class="h-32 bg-gray-100 rounded mb-3 flex items-center justify-center text-gray-400 text-sm">
    Belum ada gambar
  </div>
  <p class="text-xs text-gray-500">{{ p.category.nama }}</p>
  <h3 class="font-medium">{{ p.nama }}</h3>
  <p class="text-blue-600 font-bold mt-auto">{{ p.harga | rupiah }}</p>
  <p class="text-xs {{ 'text-red-600' if p.stock == 0 else 'text-gray-500' }}">
    {{ 'Stok habis' if p.stock == 0 else 'Stok ' ~ p.stock }}
  </p>
</a>

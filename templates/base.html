<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Commerce{% endblock %}</title>
  <script src="{{ url_for('static', filename='js/email-saran.js') }}" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <main class="max-w-md mx-auto mt-12 px-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for kategori, pesan in messages %}
        <div class="mb-4 p-3 rounded {{ 'bg-red-100 text-red-700' if kategori == 'error' else 'bg-green-100 text-green-700' }}">
          {{ pesan }}
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

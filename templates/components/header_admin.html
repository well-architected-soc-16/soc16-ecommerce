{# §12 Header admin — tanpa bar pengumuman & kolom cari #}
<header class="bg-white border-b border-neutral-200">
  <div class="max-w-7xl mx-auto p-4 flex items-center justify-between gap-4">
    <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-3" aria-label="Dashboard admin Pururuna">
      <span class="font-display font-extrabold text-[30px] uppercase tracking-[0.3px] text-[#111] leading-none">Pururuna</span>
      <span class="rounded bg-[#111] px-2.5 py-[3px] font-display font-bold text-[13px] uppercase tracking-[1.56px] text-white">Admin</span>
    </a>

    <div class="flex items-center gap-4">
      <a href="{{ url_for('shop.index') }}"
         class="hidden sm:inline-flex items-center gap-1 rounded-full border-[1.5px] border-[#111] px-4 py-[9px] font-display font-bold text-[15px] uppercase tracking-[0.75px] text-[#111] hover:bg-neutral-100 active:bg-neutral-200">
        Lihat toko <span aria-hidden="true">&#8599;</span>
      </a>
      {% with trigger = "admin" %}{% include "components/account_menu.html" %}{% endwith %}
    </div>
  </div>
</header>
